<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对话几何 fixture（合成）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; background: #f6f2f5; color: #222; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  #frames { position: relative; width: 460px; height: 900px; }
  #frames iframe { border: 1px dashed #a06; background: #fff; position: absolute; left: 0; top: 0; }
  #out { white-space: pre-wrap; font: 11px/1.4 ui-monospace, Consolas, monospace;
         background: #fff; border: 1px solid #ddd; padding: 8px; max-height: 300px; overflow: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  label { font-size: 12px; }
</style>
</head>
<body>
<h1>对话几何 fixture（真实 app.css + app.js，合成角色图/文本）</h1>
<div class="row">
  <label>用例 <select id="caseSelect"></select></label>
  <button id="runOne" type="button">运行选中用例</button>
  <button id="runAll" type="button">运行全部</button>
  <span id="state"></span>
</div>
<div id="frames"></div>
<pre id="out"></pre>
<script src="/fixture.js"></script>
</body>
</html>
